  <div class="section">
        <h2>Export Frame to CSV</h2>
        
        <div class="input-group">
            <label for="frameSelect">Select Frame:</label>
            <select id="frameSelect">
                  <option value="">Loading frames...</option>
              </select>
          </div>

    

          <button id="exportBtn" disabled>Export CSV</button>
      </div>
  </select>

      <div class="section">
        <h2>Upload CSV & Generate</h2>

        <div class="input-group">
            <label for="fileInput">Select CSV File:</label>
            <input type="file" id="fileInput" accept=".csv">
        </div>

       
        <button id="generateBtn" class="primary" disabled>Generate</button>
    </div>


    <div class="section">
        <h2>Imported Frames</h2>
        <div id="generatedFramesContainer"></div>
    </div>

    <div id="status" class="status-box">Status: Ready</div>
    <div class="actions">
        <button id="refreshBtn" class="secondary">Refresh Frames</button>
        <button id="closeBtn" class="danger">Close</button>
    </div>

<script>
const frameSelect = document.getElementById('frameSelect');
const exportBtn = document.getElementById('exportBtn');
const fileInput = document.getElementById('fileInput');
const fileNameDisplay = document.getElementById('fileNameDisplay');
const generateBtn = document.getElementById('generateBtn');
const generatedFramesContainer = document.getElementById('generatedFramesContainer');
const status = document.getElementById('status');
const refreshBtn = document.getElementById('refreshBtn');
const closeBtn = document.getElementById('closeBtn');


 window.addEventListener("message", (event) => {
            const msg = event.data.pluginMessage;
            if (!msg) return;
            
            if (msg.type === 'frames-loaded') {
                availableFrames = msg.frames;
                frameSelect.innerHTML = '<option value="">-- Select a frame --</option>';
                availableFrames.forEach(frame => {
                    const option = document.createElement('option');
                    option.value = frame.id;
                    option.textContent = frame.name;
                    frameSelect.appendChild(option);
                });
                
                frameSelect.addEventListener('change', () => {
                    exportBtn.disabled = !frameSelect.value;
                });
            }

            if (msg.type === 'export-data') {
              console.log("Received data from plugin:", msg.data);
              if(msg.data.error){
               console.error(msg.data.error);
              }
              console.log('Exported frames to CSV successfully');
              
              if (msg.data.csvContent !== undefined) {
                  // Trigger a download using a Blob and an anchor element
                  // This will show a "Save As" dialog if the browser is configured to ask,
                  // or download it straight to the default Downloads folder.
                  const blob = new Blob([msg.data.csvContent], { type: 'text/csv;charset=utf-8;' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `${msg.data.frameName || 'export'}.csv`;
                  
                  // Appending to body is required to trigger click in some browsers
                  document.body.appendChild(a);
                  a.click();
                  
                  // Cleanup
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
              }
            }

            
          })

exportBtn.onclick = () => {
  console.log("Button clicked");
  console.log(frameSelect.value);

  const frameId = frameSelect.value;
  if (frameId) {
    // parent.postMessage is asynchronous and does not return a value.
    // We send the message here, and the result will be received by
    // the window.addEventListener("message", ...) listener above.
    parent.postMessage({ pluginMessage: { type: 'export-data', frameId } }, '*');
    console.log("Message sent to plugin backend");
  }
};

generateBtn.onclick = () => {
    console.log("Button clicked");
    console.log(fileInput.value);
    const file = fileInput.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const csvContent = e.target.result;
            parent.postMessage({ pluginMessage: { type: 'import-data', csvContent } }, '*');
            console.log("Message sent to plugin backend");
        };
        reader.readAsText(file);
    }
} 

</script>
